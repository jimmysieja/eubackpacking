# Optional call-outs for specific stops. Key = city name exactly as it appears
# in the stops CSV. Shows as an italic note in that city's panel on the map, and
# (for slept/day-trip pins) replaces the plain label on the map itself.
#
# Short form:
#   Krka National Park: day trip from Split
#
# Long form:
#   Niksic:
#     label: a hitched ride caught on the way south
#     kind: leg
#
# kind: transit  — a rail/ferry/air waypoint, not a day trip. The panel drops
# the "day trip" line and the map hover reads "· passing through".
#
# Time on the ground for a transit stop — give the arrive / leave timestamps
# straight off the Eurail app and the build formats the window + duration:
#   Cologne:
#     kind: transit
#     layover: ["2026-04-06 22:00", "2026-04-07 02:00"]
# -> panel + hover read "06 Apr 22:00 – 07 Apr 02:00 · 4h on the ground".
# (`window: "22:00 – 02:00"` still works if you only have the clock times.)

Zagreb:
  kind: transit
  label: Quick 3 hour layover between Ljubljana and Split

# Layovers below are timed off the Eurail journey list (arrival of the inbound
# journey → departure of the outbound one).
Cologne:
  kind: transit
  layover: ["2026-04-06 22:15", "2026-04-07 02:09"]   # birthday layover, waiting on the Hamburg train
Warsaw:
  kind: transit
  layover: ["2026-04-20 19:03", "2026-04-20 19:40"]   # off the Vilnius train, straight onto Kraków
Kraków:
  kind: transit
  layover: ["2026-04-20 22:33", "2026-04-21 00:18"]   # midnight wait for the Bratislava sleeper

# Stops on the hitched drive Sarajevo -> Žabljak.
Plužine: { kind: transit }
Niksic:  { kind: transit }

# Waypoints with no separately-timed layover — they sit inside a single
# multi-change journey the app never split (Lille/Tournai/Brussels within
# Paris→Köln; Hamburg within Köln→Copenhagen; Mockava within Vilnius→Warszawa;
# Ostrava/Brno within Kraków→Bratislava).
Holyhead: { kind: transit }
Galway:   { kind: transit }
Lille:    { kind: transit }
Tournai:  { kind: transit }
Brussels: { kind: transit }
Hamburg:  { kind: transit }
Turku:    { kind: transit }
Mockava:  { kind: transit }
Ostrava:  { kind: transit }
Brno:     { kind: transit }
Beauvais: { kind: transit }
