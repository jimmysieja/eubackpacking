# Optional call-outs for specific stops. Key = city name exactly as it appears
# in the stops CSV. Shows as an italic note in that city's panel on the map, and
# (for slept/day-trip pins) replaces the plain label on the map itself.
#
# Short form:
#   Krka National Park: day trip from Split
#
# Long form:
#   Niksic:
#     label: a hitched ride caught on the way south
#     kind: leg
#
# kind: transit  — a rail/ferry/air waypoint, not a day trip. The panel drops
# the "day trip" line and the map hover reads "· passing through". Add
#   window: "04:08 – 04:41"
# once the time on the ground is known; it shows in place of the date range.

Zagreb:
  kind: transit
  label: Quick 3 hour layover between Ljubljana and Split

Cologne:
  kind: transit
  window: "22:00 – 02:00"        # birthday layover, waiting on the Hamburg train

# Stops on the hitched drive Sarajevo -> Žabljak.
Pluzine: { kind: transit }
Niksic:  { kind: transit }

