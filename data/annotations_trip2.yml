Cologne:
  kind: transit
  layover: ["2026-04-06 22:15", "2026-04-07 02:09"]   # turned 23 here, waiting on the Hamburg train
Hamburg:
  kind: transit
  layover: ["2026-04-07 06:50", "2026-04-07 08:53"]

Turku:
  kind: transit
  layover: ["2026-04-13 16:00", "2026-04-13 20:57"]   # ferry-in time approximate

