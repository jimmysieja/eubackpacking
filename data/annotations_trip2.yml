# Trip 2 (Spring 2026) call-outs. One file per trip: annotations_<trip>.yml,
# loaded like the rail_<trip>.yml overrides.
#
# Optional call-outs for specific stops. Key = city name exactly as it appears
# in the stops CSV. Shows as an italic note in that city's panel on the map, and
# (for slept/day-trip pins) replaces the plain label on the map itself.
#
# Short form:
#   Krka National Park: day trip from Split
#
# Long form:
#   Niksic:
#     label: a hitched ride caught on the way south
#     kind: leg
#
# kind: transit  — a rail/ferry/air waypoint, not a day trip. The panel drops
# the "day trip" line and the map hover reads "· passing through".
#
# Layover for a transit stop — give the arrive / leave timestamps straight off
# the Eurail app and the build formats the window + length:
#   Cologne:
#     kind: transit
#     layover: ["2026-04-06 22:15", "2026-04-07 02:09"]
# -> panel reads "06 Apr 22:15 – 07 Apr 02:09 · 3h54 layover", hover "· 3h54 layover".
# (`window: "22:00 – 02:00"` still works if you only have the clock times.)

# --- Layovers, timed off the Eurail journey detail (arrive → leave) ---------

Oxford:
  kind: transit
  layover: ["2026-03-17 13:28", "2026-03-17 15:39"]   # walk round town, on the way to Liverpool

# The Paris → Copenhagen haul, 6–7 Apr (four changes, then Hamburg overnight)
