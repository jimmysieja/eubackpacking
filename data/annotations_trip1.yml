# Trip 1 (Summer 2025) call-outs. Same format as annotations_trip2.yml:
# key = city name exactly as it appears in trip1_stops.csv.
#
# kind: transit — a rail/ferry/air waypoint, not a day trip. Drops the
# "day trip" line from the panel; the map hover reads "· passing through".
# layover: ["<arrive>", "<leave>"] times off the Eurail app format the window.

Domodossola:
  kind: transit
  layover: ["2025-07-18 08:11", "2025-07-18 10:26"]   # off the Zermatt train, waiting on the Milan one

# Night train Budapest -> Kraków: got on the wrong one and ended up routed
# through Czechia. No separately-timed layovers.
Břeclav: { kind: transit }
Ostrava: { kind: transit }

# On the Kraków -> Warszawa run (via a wrong-train detour south) — passed
# through, never stopped to look around.
Maków Podhalański: { kind: transit }
Zakopane:          { kind: transit }

# Brief stops, no overnight.
Lyon:
  kind: transit
  label: overnight bus from Nice, on to Annecy that morning
Naples:
  kind: transit
  label: in on the night bus, straight on to Ercolano
Bari:
  kind: transit
  label: off the train, onto the overnight Durrës ferry
Durrës:
  kind: transit
  label: off the ferry, bus straight on to Tirana
