<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map · A gap year around Europe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Spline+Sans+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    /* fallback — real values come from palette.json at load */
    --paper:#f3efe6; --ink:#211d17; --dim:#6f6a5c; --rule:#d7d0be;
    --accent:#7c3b2c; --gold:#9a7636; --far:#e2dbc9;
    --trip1:#cc9a1f; --trip2:#4e9ca2;
    --serif:"Fraunces","Iowan Old Style",Georgia,serif;
    --mono:"Spline Sans Mono",ui-monospace,SFMono-Regular,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--mono)}
  #map{position:absolute;inset:0;background:var(--paper)}
  .leaflet-container{background:var(--paper);font-family:var(--mono);outline:none}
  .leaflet-top.leaflet-left{top:44px;left:6px}   /* zoom buttons below the back link */
  .leaflet-control-zoom a{background:var(--paper);color:var(--ink);border-color:var(--rule)}
  .leaflet-control-attribution{background:transparent;color:var(--dim);font-size:9px}
  .leaflet-control-attribution a{color:var(--dim)}

  .back{position:absolute;top:14px;left:16px;z-index:1000;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink);text-decoration:none;background:var(--paper);
    padding:7px 11px;border:1px solid var(--rule)}
  .back:hover{border-color:var(--ink)}

  .legend{position:absolute;bottom:14px;left:16px;z-index:1000;background:var(--paper);
    border:1px solid var(--rule);padding:11px 13px;font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--dim);line-height:1}
  .legend .row{display:flex;align-items:center;gap:8px;margin:5px 0}
  .legend .row:first-child{margin-top:0}
  .legend b{color:var(--ink);font-weight:500}
  .legend svg{flex:none}
  .legend .dot{width:9px;height:9px;border-radius:50%;border:1.4px solid var(--paper)}
  .legend hr{border:none;border-top:1px solid var(--rule);margin:8px 0 6px}

  /* permanent name labels, seated round their pin by placeLabels() */
  .pinlabel span{position:absolute;white-space:nowrap;line-height:12px;padding:0 1px}
  .pinlabel.off span{visibility:hidden}
  .pinlabel.off.peek span{visibility:visible}
  .city-label{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink);
    text-shadow:0 0 3px var(--paper),0 0 3px var(--paper),0 0 3px var(--paper),0 0 2px var(--paper)}
  .anno-label{font-family:var(--serif);font-style:italic;
    font-size:11px;color:var(--dim);text-shadow:0 0 3px var(--paper),0 0 3px var(--paper),0 0 3px var(--paper)}

  #panel{position:absolute;top:0;right:0;bottom:0;width:min(380px,86vw);z-index:1000;
    background:var(--paper);border-left:1px solid var(--rule);transform:translateX(100%);
    transition:transform .28s ease;overflow-y:auto;padding:26px 24px 40px}
  #panel.open{transform:none}
  #panel .close{position:absolute;top:16px;right:18px;border:none;background:none;color:var(--dim);
    font-size:20px;cursor:pointer;line-height:1}
  #panel .tag{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 14px}
  #panel h2{font-family:var(--serif);font-weight:400;font-size:30px;margin:0 0 4px;letter-spacing:-.01em}
  #panel .sub{font-family:var(--serif);font-style:italic;color:var(--dim);font-size:14px;margin:0 0 6px}
  #panel .sub .subdate{display:block;margin-top:5px}
  #panel .chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-style:normal;
    font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  #panel .chip + .chip{margin-left:14px}
  #panel .chip i{width:8px;height:8px;border-radius:50%;flex:none}
  #panel .note{font-family:var(--serif);font-size:14px;color:var(--ink);margin:0 0 22px;
    padding-left:12px;border-left:2px solid var(--accent)}
  #panel figure{margin:0 0 18px}
  #panel img{width:100%;display:block;background:var(--rule);cursor:zoom-in}
  #panel figcaption{font-family:var(--serif);font-style:italic;font-size:12px;color:var(--dim);margin-top:5px}
  #panel .empty{font-family:var(--serif);font-style:italic;color:var(--dim);font-size:14px}
  /* a dual-trip city's stints each carry their trip colour down the margin, so
     the 2025 -> 2026 switch reads at a glance while scrolling through photos,
     not just from the small chip dot. */
  #panel .stint{border-left:4px solid var(--stint,var(--rule));padding-left:9px;margin-left:-13px;
    border-right:4px solid var(--stint,var(--rule));padding-right:9px;margin-right:-13px}
  #panel .stint:first-child .leghead{margin-top:2px}
  #panel .leghead{font-family:var(--serif);font-size:16px;color:var(--ink);margin:26px 0 12px;
    padding-bottom:5px;border-bottom:2px solid var(--stint,var(--rule))}
  #panel .leghead .chip{display:flex;margin-bottom:6px}
  #panel .leghead .lbl{display:block}
  #panel .leghead .dt{display:block;margin-top:3px;font-family:var(--mono);font-size:10px;
    letter-spacing:.06em;color:var(--dim)}
  #panel .dayhead{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
    margin:18px 0 10px}
  #panel .dayhead:first-child{margin-top:0}

  #lightbox{position:fixed;inset:0;z-index:2000;background:rgba(20,18,14,.92);display:none;
    align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
  #lightbox.open{display:flex}
  #lightbox img{max-width:100%;max-height:100%;object-fit:contain}
</style>
</head><body>
<a class="back" href="../">&larr; back</a>
<div id="map"></div>
<div class="legend" id="legend"></div>
<div id="panel">
  <button class="close" aria-label="close">&times;</button>
  <p class="tag">Stop</p>
  <h2 id="p-city"></h2>
  <p class="sub" id="p-sub"></p>
  <p class="note" id="p-note" hidden></p>
  <div id="p-photos"></div>
</div>
<div id="lightbox"><img alt=""></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(async function () {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;

  let C = { paper:'#f3efe6', ink:'#211d17', dim:'#6f6a5c', rule:'#d7d0be',
            accent:'#7c3b2c', gold:'#9a7636', far:'#e2dbc9',
            trip1:'#cc9a1f', trip2:'#4e9ca2' };
  try {
    const pal = await fetch('palette.json').then(r => r.json());
    C = pal[dark ? 'dark' : 'light'];
    for (const k of ['paper','ink','dim','rule','accent','gold','far','trip1','trip2'])
      if (C[k]) document.documentElement.style.setProperty('--' + k, C[k]);
  } catch (e) { /* fall back to CSS defaults */ }

  const data = await fetch('data.json').then(r => r.json());
  const inkVar = t => C[(data.trips.find(x => x.id === t) || {}).ink] || C.accent;
  const tripName = t => (data.trips.find(x => x.id === t) || {}).name || t;

  // per-mode line style: [dashArray, weight, opacity, bow, wave]
  const MS = data.modeStyle || {
    train:['',1.9,0.95,0.1,0], bus:['9 6',1.4,0.85,0.14,0], ferry:['',1.4,0.85,0.22,2],
    flight:['2 7',1.3,0.62,0.55,0], car:['6 2 1 2 1 2',1.3,0.85,0.1,0] };
  const styleFor = m => MS[m] || MS.train;

  function curve(a, b, bow) {
    if (!bow) return [a, b];
    const dx = b[0]-a[0], dy = b[1]-a[1], len = Math.hypot(dx, dy) || 1;
    const ox = -dy/len, oy = dx/len, k = len * bow;
    const cx = (a[0]+b[0])/2 + ox*k, cy = (a[1]+b[1])/2 + oy*k;
    const pts = [];
    for (let i = 0; i <= 22; i++) {
      const t = i/22, u = 1-t;
      pts.push([u*u*a[0] + 2*u*t*cx + t*t*b[0], u*u*a[1] + 2*u*t*cy + t*t*b[1]]);
    }
    return pts;
  }

  const map = L.map('map', { zoomControl:true, attributionControl:true, minZoom:3, maxZoom:9,
                             zoomSnap:0.5 });   // half steps, so the opening fit fills the screen
  map.setView([54, 12], 4);
  map.attributionControl.setPrefix('');

  try {
    const geo = await fetch('europe.geojson').then(r => r.json());
    L.geoJSON(geo, { interactive:false, style: f => ({
      color: f.properties.far ? C.far : C.dim, weight: f.properties.far ? 0.9 : 1.1, fill:false,
      opacity: f.properties.far ? 1 : 0.85 }) }).addTo(map);
    map.attributionControl.addAttribution('outline: Natural Earth');
  } catch (e) {}

  // a ferry leg is a wave of constant on-screen size, so it's re-traced at each zoom
  const waves = [];
  data.legs.forEach(g => {
    const [dash, wt, op, bow, wave] = styleFor(g.mode);
    const pts = curve(g.a, g.b, bow);
    const line = L.polyline(pts, {
      color: inkVar(g.trip), weight: wt, opacity: op,
      dashArray: dash || null, lineCap: dash.startsWith('0.1') ? 'round' : 'butt',
      interactive: false, smoothFactor: wave ? 0 : 1
    }).addTo(map);
    if (wave) waves.push({ line, pts, amp: wave });
  });

  // a sine of amplitude `amp` px along a polyline, fitted to a whole number of
  // periods (each 4x amp) so it meets both pins. Mirrors _wave_path() in dashboard.py.
  function wavy(pts, amp) {
    const px = pts.map(p => map.latLngToLayerPoint(p));
    const cum = [0];
    for (let i = 1; i < px.length; i++) cum.push(cum[i - 1] + px[i].distanceTo(px[i - 1]));
    const total = cum[cum.length - 1];
    if (total < amp * 2) return pts;
    const periods = Math.max(1, Math.round(total / (amp * 4))), n = periods * 12, out = [];
    for (let i = 0, j = 0; i <= n; i++) {
      const s = total * i / n;
      while (j < px.length - 2 && cum[j + 1] < s) j++;
      const a = px[j], b = px[j + 1], seg = (cum[j + 1] - cum[j]) || 1;
      const t = (s - cum[j]) / seg, o = amp * Math.sin(2 * Math.PI * periods * i / n);
      out.push(map.layerPointToLatLng([a.x + (b.x - a.x) * t - (b.y - a.y) / seg * o,
                                       a.y + (b.y - a.y) * t + (b.x - a.x) / seg * o]));
    }
    return out;
  }
  const retraceWaves = () => waves.forEach(w => w.line.setLatLngs(wavy(w.pts, w.amp)));
  retraceWaves();
  map.on('zoomend', retraceWaves);

  const annoOf = (trip, city) => ((data.annotations || {})[trip] || {})[city];

  // a dual-trip city gets a disc split down the middle, one half per trip colour
  function splitIcon(inks, r) {
    const s = r + 1.4, d = s * 2;
    const body = inks.length < 2
      ? `<circle r="${r}" fill="${inks[0]}"/>`
      : `<path d="M0,${-r} A${r},${r} 0 0,0 0,${r} Z" fill="${inks[0]}"/>`
      + `<path d="M0,${-r} A${r},${r} 0 0,1 0,${r} Z" fill="${inks[1]}"/>`;
    return L.divIcon({ className:'', iconSize:[d,d], iconAnchor:[s,s],
      html:`<svg width="${d}" height="${d}" viewBox="${-s} ${-s} ${d} ${d}">${body}`
         + `<circle r="${r}" fill="none" stroke="${C.paper}" stroke-width="1.6"/></svg>` });
  }

  // Every city slept in gets a permanent name label (an annotation, if it has
  // one, stands in for the name); waypoints and day trips only name themselves
  // on hover. placeLabels() seats the labels afresh at each zoom, longest stays
  // first, trying eight spots round the pin. One with nowhere free waits for a
  // closer zoom and shows on hover in the meantime.
  map.createPane('labels').style.zIndex = 650;
  const bounds = [], pins = [], labels = [];

  function addLabel(pin, m, rank, text, cls) {
    const span = document.createElement('span');
    span.className = cls;
    span.textContent = text;
    const mk = L.marker(pin.ll, { pane:'labels', interactive:false, keyboard:false,
      icon: L.divIcon({ className:'pinlabel', html:span, iconSize:null, iconAnchor:[0, 0] }) }).addTo(map);
    labels.push({ pin, rank, mk, span, w:0, h:0 });
    m.on('mouseover', () => { mk.getElement().classList.add('peek'); mk.setZIndexOffset(1000); });
    m.on('mouseout', () => { mk.getElement().classList.remove('peek'); mk.setZIndexOffset(0); });
  }

  data.cities.forEach(c => {
    bounds.push([c.lat, c.lon]);
    const r = c.slept ? 6 : 4;
    const m = c.dual
      ? L.marker([c.lat, c.lon], { icon: splitIcon(c.inks.map(k => C[k] || C.accent), r) }).addTo(map)
      : L.circleMarker([c.lat, c.lon], {
          radius: r, weight: 1.4, color: C.paper,
          fillColor: C[c.ink] || C.accent, fillOpacity: 1 }).addTo(map);
    const pin = { ll: L.latLng(c.lat, c.lon), r };
    pins.push(pin);

    const a = c.trip ? annoOf(c.trip, c.city) : null;
    if (a && a.label && a.kind !== 'transit') {
      addLabel(pin, m, c.nights, a.label, 'anno-label');
    } else if (c.slept) {
      addLabel(pin, m, c.nights, c.city, 'city-label');
    } else if (c.transit) {
      m.bindTooltip(`${c.city} · passing through`, { direction:'top' });
    } else {
      m.bindTooltip(`${c.city} · day trip`, { direction:'top' });
    }
    m.on('click', () => openPanel(c));
  });
  labels.sort((a, b) => b.rank - a.rank);

  // candidate spots, in order of preference: offset of the label's top-left
  // corner from the pin centre, given the label's size and the pin radius
  const d45 = r => Math.round(r * 0.7) + 2;
  const SPOTS = [
    (w, h, r) => [r + 3, -h / 2],                    // right
    (w, h, r) => [-r - 3 - w, -h / 2],               // left
    (w, h, r) => [d45(r), -d45(r) - h],              // above right
    (w, h, r) => [d45(r), d45(r)],                   // below right
    (w, h, r) => [-d45(r) - w, -d45(r) - h],         // above left
    (w, h, r) => [-d45(r) - w, d45(r)],              // below left
    (w, h, r) => [-w / 2, -r - 2 - h],               // above
    (w, h, r) => [-w / 2, r + 2],                    // below
  ];
  const hits = (b, o) => b[0] < o[2] && b[2] > o[0] && b[1] < o[3] && b[3] > o[1];

  function placeLabels() {
    labels.forEach(lb => { lb.w = lb.span.offsetWidth; lb.h = lb.span.offsetHeight; });
    const pt = new Map(pins.map(p => [p, map.latLngToLayerPoint(p.ll)]));
    // does a box touch a pin's disc (its outline included)?
    const covers = (b, p) => {
      const q = pt.get(p), x = Math.max(b[0], Math.min(q.x, b[2])), y = Math.max(b[1], Math.min(q.y, b[3]));
      return (x - q.x) ** 2 + (y - q.y) ** 2 < (p.r + 1) ** 2;
    };
    const tl = map.containerPointToLayerPoint([0, 0]), br = map.containerPointToLayerPoint(map.getSize());
    const inView = b => b[0] >= tl.x && b[1] >= tl.y && b[2] <= br.x && b[3] <= br.y;
    // other labels and the overnight pins are off limits. Beyond that, the
    // best spot is on screen and clear of the small waypoint pins; on screen
    // but over a waypoint beats clear but cut off by the edge.
    const bigPins = pins.filter(p => p.r >= 6);
    const taken = [];
    labels.forEach(lb => {
      const q = pt.get(lb.pin);
      let spot = null, best = Infinity;
      for (const f of SPOTS) {
        const [dx, dy] = f(lb.w, lb.h, lb.pin.r).map(Math.round);
        const box = [q.x + dx, q.y + dy, q.x + dx + lb.w, q.y + dy + lb.h];
        const padded = [box[0] - 1, box[1] - 1, box[2] + 1, box[3] + 1];   // labels keep a hair apart
        const onPin = p => p !== lb.pin && covers(box, p);
        if (taken.some(o => hits(padded, o)) || bigPins.some(onPin)) continue;
        const cost = (inView(box) ? 0 : 2) + (pins.some(onPin) ? 1 : 0);
        if (cost < best) { best = cost; spot = [dx, dy, padded]; }
        if (!cost) break;
      }
      const [dx, dy] = spot || SPOTS[0](lb.w, lb.h, lb.pin.r).map(Math.round);
      lb.span.style.left = dx + 'px';
      lb.span.style.top = dy + 'px';
      lb.mk.getElement().classList.toggle('off', !spot);
      if (spot) taken.push(spot[2]);
    });
  }
  placeLabels();
  map.on('moveend', placeLabels);                                // after every zoom and pan
  if (document.fonts) document.fonts.ready.then(placeLabels);   // re-measure once the webfont is in

  // legend — every mode that appears, plus the trips
  const modesSeen = [...new Set(data.legs.map(g => g.mode))];
  const order = ['train','bus','ferry','car','flight','bike','walk'];
  modesSeen.sort((a,b) => order.indexOf(a) - order.indexOf(b));
  const leg = document.getElementById('legend');
  const bothRow = data.cities.some(c => c.dual)
    ? `<div class="row"><svg class="dot" width="10" height="10" viewBox="-5 -5 10 10">`
      + `<path d="M0,-4.4 A4.4,4.4 0 0,0 0,4.4 Z" fill="${C[data.trips[0].ink] || C.accent}"/>`
      + `<path d="M0,-4.4 A4.4,4.4 0 0,1 0,4.4 Z" fill="${C[data.trips[1].ink] || C.gold}"/>`
      + `</svg><b>both trips</b></div>`
    : '';
  leg.innerHTML = data.trips.map(t =>
    `<div class="row"><span class="dot" style="background:${C[t.ink] || C.accent}"></span><b>${tripName(t.id)}</b></div>`
  ).join('') + bothRow + '<hr>' + modesSeen.map(m => {
    const [dash, wt, op, , wave] = styleFor(m);
    const cap = dash.startsWith('0.1') ? 'round' : 'butt';
    const mark = wave ? `<path d="M1 4 q2 ${-2 * wave} 4 0 t4 0 t4 0 t4 0 t4 0 t4 0" fill="none"`
                      : `<line x1="1" y1="4" x2="25" y2="4"`;
    return `<div class="row"><svg width="26" height="8">
      ${mark} stroke="${C.ink}" stroke-width="${wt}"
        stroke-dasharray="${dash}" stroke-linecap="${cap}" opacity="${op}"/></svg>${m}</div>`;
  }).join('');

  // fit once the container actually has a size
  const mapEl = document.getElementById('map');
  function fit() {
    if (!mapEl.clientWidth || !mapEl.clientHeight) return false;
    map.invalidateSize({ animate:false });
    if (bounds.length) map.fitBounds(bounds, { padding:[52,52], animate:false });
    return true;
  }
  if (!fit() && 'ResizeObserver' in window) {
    const ro = new ResizeObserver(() => { if (fit()) ro.disconnect(); });
    ro.observe(mapEl);
  }
  addEventListener('resize', fit);

  // panel + lightbox
  const panel = document.getElementById('panel');
  const lb = document.getElementById('lightbox');
  const lbImg = lb.querySelector('img');
  document.querySelector('#panel .close').onclick = () => panel.classList.remove('open');
  lb.onclick = () => lb.classList.remove('open');

  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const CC = { 'United Kingdom':'UK', 'United States':'USA',
               'Bosnia and Herzegovina':'Bosnia & Herzegovina' };
  const _wd = iso => {
    const [y, m, d] = iso.split('-').map(Number);
    return `${WD[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]}, ${MON[m - 1]} ${d}`;
  };
  const _yr = iso => iso.slice(0, 4);
  const fmtDay = iso => `${_wd(iso)}, ${_yr(iso)}`;
  const fmtRange = (a, b) => {
    if (a === b) return fmtDay(a);
    if (_yr(a) === _yr(b)) return `${_wd(a)} – ${_wd(b)}, ${_yr(a)}`;
    return `${fmtDay(a)} – ${fmtDay(b)}`;
  };

  function addFigure(wrap, p, fallbackAlt) {
    const fig = document.createElement('figure');
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.onerror = () => { if (!img.dataset.fb) { img.dataset.fb = 1; img.src = p.src; } };
    img.src = p.thumb || p.src;
    img.alt = p.caption || fallbackAlt;
    img.onclick = () => { lbImg.src = p.src; lb.classList.add('open'); };
    fig.appendChild(img);
    if (p.caption) {
      const cap = document.createElement('figcaption');
      cap.textContent = p.caption;
      fig.appendChild(cap);
    }
    wrap.appendChild(fig);
  }

  function renderDays(wrap, pics, fallbackAlt) {
    const groups = new Map();
    pics.forEach(p => {
      const k = p.date || '';
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(p);
    });
    [...groups.keys()].sort((a, b) => (a || '9999').localeCompare(b || '9999')).forEach(k => {
      if (k) {
        const h = document.createElement('p');
        h.className = 'dayhead';
        h.textContent = fmtDay(k);
        wrap.appendChild(h);
      }
      groups.get(k).forEach(p => addFigure(wrap, p, fallbackAlt));
    });
  }

  const chipHTML = st => {
    const ink = C[st.ink] || C.accent;
    return `<span class="chip" style="color:${ink}"><i style="background:${ink}"></i>${st.tripName}</span>`;
  };

  const stintSub = st =>
    st.kind === 'transit' ? fmtDay(st.start)
      : st.kind === 'daytrip' ? `day trip · ${fmtDay(st.start)}`
        : fmtRange(st.start, st.end);

  function openPanel(c) {
    document.getElementById('p-city').textContent = `${c.city}, ${CC[c.country] || c.country}`;
    const subEl = document.getElementById('p-sub');
    const noteEl = document.getElementById('p-note');
    const wrap = document.getElementById('p-photos');
    wrap.innerHTML = '';
    const pics = (data.photos && data.photos[c.city]) || [];
    const multi = c.stints.length > 1;

    if (!multi) {
      const st = c.stints[0];
      subEl.innerHTML = `${chipHTML(st)}<span class="subdate">${stintSub(st)}</span>`;
      const a = annoOf(st.trip, c.city);
      if (a && a.label) { noteEl.textContent = a.label; noteEl.hidden = false; }
      else { noteEl.textContent = ''; noteEl.hidden = true; }
      if (pics.length) renderDays(wrap, pics, c.city);
      panel.classList.add('open');
      return;
    }

    subEl.innerHTML = c.trips
      .map(t => chipHTML(c.stints.find(st => st.trip === t)))
      .join('');
    noteEl.textContent = ''; noteEl.hidden = true;

    const used = new Set();
    c.stints.forEach(st => {
      const stintEl = document.createElement('div');
      stintEl.className = 'stint';
      stintEl.style.setProperty('--stint', C[st.ink] || C.accent);
      const h = document.createElement('p');
      h.className = 'leghead';
      h.innerHTML = chipHTML(st) + (st.label ? `<span class="lbl">${st.label}</span>` : '');
      const dspan = document.createElement('span');
      dspan.className = 'dt';
      dspan.textContent = stintSub(st);
      h.appendChild(dspan);
      stintEl.appendChild(h);
      const inLeg = pics.filter(p => p.date && p.date >= st.start && p.date <= st.end);
      inLeg.forEach(p => used.add(p));
      if (inLeg.length) {
        renderDays(stintEl, inLeg, c.city);
      } else {
        const a = annoOf(st.trip, c.city);
        const e = document.createElement('p');
        e.className = 'empty';
        e.textContent = (a && a.label) ? a.label : 'No photos from this stint yet.';
        stintEl.appendChild(e);
      }
      wrap.appendChild(stintEl);
    });
    const rest = pics.filter(p => !used.has(p));
    if (rest.length) {
      const h = document.createElement('p');
      h.className = 'leghead';
      h.innerHTML = '<span class="lbl">Other photos</span>';
      wrap.appendChild(h);
      renderDays(wrap, rest, c.city);
    }
    panel.classList.add('open');
  }
})();
</script>
</body></html>
