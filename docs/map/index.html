<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The line — a map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Spline+Sans+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --paper:#f3efe6; --ink:#211d17; --dim:#6f6a5c; --rule:#cdc5b0;
    --accent:#7c3b2c; --gold:#9a7636;
    --serif:"Fraunces","Iowan Old Style",Georgia,serif;
    --mono:"Spline Sans Mono",ui-monospace,SFMono-Regular,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#17150f; --ink:#ece5d5; --dim:#948c7a; --rule:#3a352b;
    --accent:#cf7359; --gold:#c8a55f;
  }}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
    font-family:var(--mono)}
  #map{position:absolute;inset:0;background:var(--paper)}
  .leaflet-container{background:var(--paper);font-family:var(--mono);outline:none}
  .leaflet-control-zoom a{background:var(--paper);color:var(--ink);border-color:var(--rule)}
  .leaflet-control-attribution{background:transparent;color:var(--dim);font-size:9px}
  .leaflet-control-attribution a{color:var(--dim)}

  .back{position:absolute;top:14px;left:16px;z-index:1000;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink);text-decoration:none;background:var(--paper);
    padding:7px 11px;border:1px solid var(--rule)}
  .back:hover{border-color:var(--ink)}

  .legend{position:absolute;bottom:14px;left:16px;z-index:1000;
    background:var(--paper);border:1px solid var(--rule);padding:9px 12px;
    font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);line-height:1.9}
  .legend b{color:var(--ink);font-weight:500}
  .legend .sw{display:inline-block;width:18px;height:0;border-top:2px solid var(--ink);
    vertical-align:middle;margin-right:6px}
  .legend .g1{border-top-color:var(--accent)}
  .legend .g0{border-top-color:var(--gold)}
  .legend .db{border-top-style:dashed}
  .legend .dt{border-top-style:dotted}

  .city-label{background:none;border:none;box-shadow:none;
    font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink);
    text-shadow:0 0 3px var(--paper),0 0 3px var(--paper),0 0 3px var(--paper),0 0 2px var(--paper)}

  #panel{position:absolute;top:0;right:0;bottom:0;width:min(380px,86vw);z-index:1000;
    background:var(--paper);border-left:1px solid var(--rule);
    transform:translateX(100%);transition:transform .28s ease;overflow-y:auto;padding:26px 24px 40px}
  #panel.open{transform:none}
  #panel .close{position:absolute;top:16px;right:18px;border:none;background:none;
    color:var(--dim);font-size:20px;cursor:pointer;line-height:1}
  #panel .tag{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 14px}
  #panel h2{font-family:var(--serif);font-weight:400;font-size:30px;margin:0 0 4px;letter-spacing:-.01em}
  #panel .sub{font-family:var(--serif);font-style:italic;color:var(--dim);font-size:14px;margin:0 0 22px}
  #panel figure{margin:0 0 18px}
  #panel img{width:100%;display:block;background:var(--rule);cursor:zoom-in}
  #panel figcaption{font-family:var(--serif);font-style:italic;font-size:12px;color:var(--dim);margin-top:5px}
  #panel .empty{font-family:var(--serif);font-style:italic;color:var(--dim);font-size:14px}

  #lightbox{position:fixed;inset:0;z-index:2000;background:rgba(20,18,14,.92);
    display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
  #lightbox.open{display:flex}
  #lightbox img{max-width:100%;max-height:100%;object-fit:contain}
</style>
</head><body>
<a class="back" href="../">&larr; back</a>
<div id="map"></div>
<div class="legend">
  <div><span class="sw g1"></span><b>Spring 2026</b></div>
  <div><span class="sw g0"></span><b>Summer 2025</b></div>
  <div><span class="sw db"></span>bus &nbsp; <span class="sw dt"></span>ferry</div>
</div>
<div id="panel">
  <button class="close" aria-label="close">&times;</button>
  <p class="tag">Stop</p>
  <h2 id="p-city"></h2>
  <p class="sub" id="p-sub"></p>
  <div id="p-photos"></div>
</div>
<div id="lightbox"><img alt=""></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(async function () {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const C = dark
    ? { ink:'#ece5d5', rule:'#4a4436', paper:'#17150f', accent:'#cf7359', gold:'#c8a55f', far:'#2c281f' }
    : { ink:'#211d17', rule:'#c2b9a1', paper:'#f3efe6', accent:'#7c3b2c', gold:'#9a7636', far:'#e2dbc9' };
  const tripColor = t => (t === 'trip1' ? C.gold : C.accent);
  const dash = { bus:'6 5', ferry:'1 5', flight:'2 8', car:'5 4' };

  const map = L.map('map', { zoomControl:true, attributionControl:true,
    minZoom:3, maxZoom:9, worldCopyJump:false });
  map.setView([54, 12], 4);            // a view must exist before layers project
  map.attributionControl.setPrefix('');

  // faint country outlines — "route on paper", no tiles
  try {
    const geo = await fetch('europe.geojson').then(r => r.json());
    L.geoJSON(geo, { interactive:false, style: f => ({
      color: f.properties.far ? C.far : C.rule,
      weight: 0.8, fill:false, opacity: 1 }) }).addTo(map);
    map.attributionControl.addAttribution('outline: Natural Earth');
  } catch (e) { /* outline is optional */ }

  const data = await fetch('data.json').then(r => r.json());

  // legs
  data.legs.forEach(L_ => {
    L.polyline([L_.a, L_.b], {
      color: C.ink, weight: L_.mode === 'train' ? 1.7 : 1.2,
      opacity: L_.mode === 'flight' ? 0.4 : 0.72,
      dashArray: dash[L_.mode] || null, interactive:false, lineCap:'round'
    }).addTo(map);
  });

  // cities
  const bounds = [];
  data.cities.forEach(c => {
    bounds.push([c.lat, c.lon]);
    const m = L.circleMarker([c.lat, c.lon], {
      radius: c.slept ? 5 : 3, weight: 1.4,
      color: C.paper, fillColor: tripColor(c.trip), fillOpacity: 1
    }).addTo(map);
    if (c.slept) {
      m.bindTooltip(c.city, { permanent:true, direction:'right', offset:[6,0],
        className:'city-label' });
    } else {
      m.bindTooltip(`${c.city} · day trip`, { direction:'top' });
    }
    m.on('click', () => openPanel(c));
  });

  const mapEl = document.getElementById('map');
  function fit() {
    if (!mapEl.clientWidth || !mapEl.clientHeight) return false;   // pane not laid out yet
    map.invalidateSize({ animate:false });
    if (bounds.length) map.fitBounds(bounds, { padding:[50,50], animate:false });
    return true;
  }
  if (!fit() && 'ResizeObserver' in window) {
    const ro = new ResizeObserver(() => { if (fit()) ro.disconnect(); });
    ro.observe(mapEl);
  }
  addEventListener('resize', fit);

  // panel + lightbox
  const panel = document.getElementById('panel');
  const lb = document.getElementById('lightbox');
  const lbImg = lb.querySelector('img');
  document.querySelector('#panel .close').onclick = () => panel.classList.remove('open');
  lb.onclick = () => lb.classList.remove('open');

  function openPanel(c) {
    document.getElementById('p-city').textContent = c.city;
    document.getElementById('p-sub').textContent =
      `${c.country} · ${c.slept ? c.nights + ' night' + (c.nights === 1 ? '' : 's') : 'day trip'}`
      + (c.arrive ? ` · arrived ${c.arrive}` : '');
    const wrap = document.getElementById('p-photos');
    wrap.innerHTML = '';
    const pics = (data.photos && data.photos[c.city]) || [];
    if (!pics.length) {
      wrap.innerHTML = '<p class="empty">No photos from here yet.</p>';
    } else {
      pics.forEach(p => {
        const fig = document.createElement('figure');
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.onerror = () => { if (!img.dataset.fb) { img.dataset.fb = 1; img.src = p.src; } };
        img.src = p.thumb || p.src;
        img.alt = p.caption || c.city;
        img.onclick = () => { lbImg.src = p.src; lb.classList.add('open'); };
        fig.appendChild(img);
        if (p.caption) {
          const cap = document.createElement('figcaption');
          cap.textContent = p.caption;
          fig.appendChild(cap);
        }
        wrap.appendChild(fig);
      });
    }
    panel.classList.add('open');
  }
})();
</script>
</body></html>
