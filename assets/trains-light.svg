<svg viewBox="0 0 640 184" width="100%" role="img" aria-label="Estimated hours by transport mode"><style>svg{background:#ffffff;border-radius:10px}:root{--bg:#faf9f6;--card:#ffffff;--ink:#1d1c1a;--muted:#726d64;--line:#e4e0d8;--accent:#2f6f4f;--track:#efece5;--m-train:#2f6f4f;--m-bus:#c17d3c;--m-ferry:#3c8ba0;--m-flight:#4f63a8;--m-car:#9a5a4a;--m-bike:#5f8a6a;--m-walk:#8a8276;--cat-lodging:#3f6fa5;--cat-food:#c17d3c;--cat-transport:#2f6f4f;--cat-shopping:#8f5a9a;--cat-activities:#c05a5a;--cat-gifts:#3c8ba0;--cat-misc:#8a8276} text{font-family:-apple-system,Segoe UI,Roboto,sans-serif}.ct{fill:#726d64;font-size:12px;font-weight:600}.cl{fill:#1d1c1a;font-size:12px} .cs{fill:#726d64;font-size:10.5px}.cv{fill:#726d64;font-size:11.5px}</style><text x="0" y="15" class="ct">Estimated hours by transport mode</text><text x="130" y="45.0" class="cl" text-anchor="end">Train</text><rect x="140" y="30" width="408" height="18" rx="3" fill="var(--track)"/><rect x="140" y="30" width="408.0" height="18" rx="3" fill="var(--m-train)"/><text x="556.0" y="45.0" class="cv">101.9 h</text><text x="130" y="75.0" class="cl" text-anchor="end">Bus</text><rect x="140" y="60" width="408" height="18" rx="3" fill="var(--track)"/><rect x="140" y="60" width="82.4" height="18" rx="3" fill="var(--m-bus)"/><text x="230.4" y="75.0" class="cv">20.6 h</text><text x="130" y="105.0" class="cl" text-anchor="end">Ferry</text><rect x="140" y="90" width="408" height="18" rx="3" fill="var(--track)"/><rect x="140" y="90" width="69.0" height="18" rx="3" fill="var(--m-ferry)"/><text x="217.0" y="105.0" class="cv">17.2 h</text><text x="130" y="135.0" class="cl" text-anchor="end">Flight</text><rect x="140" y="120" width="408" height="18" rx="3" fill="var(--track)"/><rect x="140" y="120" width="142.3" height="18" rx="3" fill="var(--m-flight)"/><text x="290.3" y="135.0" class="cv">35.5 h</text><text x="130" y="165.0" class="cl" text-anchor="end">Car</text><rect x="140" y="150" width="408" height="18" rx="3" fill="var(-