# Publishes the pre-built docs/ folder to GitHub Pages.
#
# The site is a pure static export of docs/ (built locally with `python build.py`
# and committed). This workflow just uploads that folder and deploys it — no
# Python, no Jekyll.
#
# One-time setup: repo Settings → Pages → Build and deployment → Source →
# "GitHub Actions".

name: Deploy docs/ to Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
