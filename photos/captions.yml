# One entry per photo file in photos/. `file` = filename, `caption` shows under
# it, `city` ties it to a stop (must match the city name in the stops CSV — it's
# how the map knows which pin to hang the photo on). `featured: true` also pulls
# it into the README.
#
# The build makes web-size thumbnails automatically (docs/photos/thumb/); the
# full file opens in the lightbox. Keep originals a sane size (long edge
# ~2000px) and the total under ~100 photos.

- file: zabljak-durmitor.jpg
  caption: The Durmitor massif on the walk out of Žabljak.
  city: Žabljak
